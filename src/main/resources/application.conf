force {
  data-source-name    = "GitHubEvents"
  broadcast-data-name = "BroadcastData"

  partitions = [0, 1, 2, 3]    # Example partition IDs; adjust to actual cluster size

  join-keys = [
    { left-field = "actor"; right-field = "login" },
    { left-field = "repo";  right-field = "name"  }
  ]
}

akka {
  actor {
    provider = cluster
  }
  remote {
    artery {
      canonical.hostname = "127.0.0.1"
      canonical.port     = 2551
    }
  }
  cluster {
    seed-nodes = [
      "akka://DistribuQuerySystem@127.0.0.1:2551"
    ]
    auto-down-unreachable-after = 10s
  }
  loglevel = "INFO"
},
    { left-field = "repo";  right-field = "name"  }
  ]
}
